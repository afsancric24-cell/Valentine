<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        h1 {
            color: #ff4d6d;
            font-size: 2.5rem;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        .gif-container img {
            width: 250px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 50px;
            position: relative;
        }
        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }
        #noBtn {
            background-color: #888;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>

    <h1 id="headerText">Will you be my Valentine?</h1>

    <div class="gif-container">
        <img id="displayGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMGIwZHIxNnBvOTh4dmY1b3MzbnVwcnI2Z2Z2amZ6Z2Z2amZ6Z2Z2aiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LwsCiZPppEiOI/giphy.gif" alt="Puppy Eyes">
    </div>

    <div class="buttons">
        <button id="yesBtn">Yes! ❤️</button>
        <button id="noBtn">No</button>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const headerText = document.getElementById('headerText');
        const displayGif = document.getElementById('displayGif');

        // Success Action
        yesBtn.addEventListener('click', () => {
            headerText.innerHTML = "I knew you'd say YES! 🥰";
            displayGif.src = "https://media.giphy.com/media/T86i6yDyOYz7J6dPhf/giphy.gif"; // Celebration GIF
            noBtn.style.display = 'none';
            yesBtn.style.display = 'none';
        });

        // The "No" Button evasion logic
        function moveNoButton() {
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveNoButton();
        });
    </script>
</body>
</html>
